<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css"><style>.auth{min-height:100vh;display:grid;place-items:center;padding:1rem}.auth .card{width:min(420px,100%);padding:1.6rem}</style></head>
<body><main class="auth"><div class="card"><h1>Sign in</h1><p class="muted">Welcome back to your workspace.</p>
<form id="f" novalidate><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
<div class="err" id="msg" role="alert" style="color:var(--coral);margin-bottom:.6rem"></div>
<button class="btn" style="width:100%;justify-content:center" id="go">Sign in</button></form>
<p class="small muted" style="margin-top:1rem">No account? <a href="/register.html">Create a workspace</a> &middot; <a href="/">Home</a></p></div></main>
<script src="/js/api.js"></script><script>
if(API.token()) location.href="/app.html";
f.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";if(!validateForm(f))return;
 await withBusy(go,async()=>{try{API.setSession(await API.post("/auth/login",{email:email.value.trim(),password:password.value}));location.href="/app.html"}catch(x){msg.textContent=x.message}})});
</script></body></html>
