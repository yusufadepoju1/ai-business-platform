<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create workspace - Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css"><style>.auth{min-height:100vh;display:grid;place-items:center;padding:1rem}.auth .card{width:min(480px,100%);padding:1.6rem}</style></head>
<body><main class="auth"><div class="card"><h1>Create your workspace</h1><p class="muted">Set up your business, then teach your assistants from your own documents.</p>
<form id="f" novalidate>
<div class="field"><label for="business_name">Business name</label><input id="business_name" required minlength="2"></div>
<div class="field"><label for="industry">Industry</label><select id="industry"><option>Retail</option><option>Real estate</option><option>Healthcare</option><option>Education</option><option>Hospitality</option><option>Finance</option><option>Technology</option><option>Home services</option><option>Energy</option><option>General</option></select></div>
<div class="field"><label for="full_name">Your name</label><input id="full_name" required minlength="2" autocomplete="name"></div>
<div class="field"><label for="email">Work email</label><input id="email" type="email" required autocomplete="username"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="new-password"><span class="hint">At least 8 characters.</span></div>
<div class="err" id="msg" role="alert" style="color:var(--coral);margin-bottom:.6rem"></div>
<button class="btn" style="width:100%;justify-content:center" id="go">Create workspace</button></form>
<p class="small muted" style="margin-top:1rem">Already registered? <a href="/login.html">Sign in</a> &middot; <a href="/">Home</a></p></div></main>
<script src="/js/api.js"></script><script>
if(API.token()) location.href="/app.html";
f.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";if(!validateForm(f))return;
 await withBusy(go,async()=>{try{API.setSession(await API.post("/auth/register",{business_name:business_name.value.trim(),industry:industry.value,full_name:full_name.value.trim(),email:email.value.trim(),password:password.value}));location.href="/app.html#dashboard"}catch(x){msg.textContent=x.message}})});
</script></body></html>
