# Render Blueprint: one web service (API + static frontend) and a managed PostgreSQL database.
services:
  - type: web
    name: ai-business-platform
    runtime: python
    plan: starter            # a persistent disk (needed for the FAISS index) requires a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: vector-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-business-db
          property: connectionString
      - key: VECTOR_DIR
        value: /var/data/vectors
      - key: GROQ_API_KEY
        sync: false          # enter in the Render dashboard
      - key: PUBLIC_BASE_URL
        sync: false          # e.g. https://ai-business-platform.onrender.com
      - key: EMBEDDING_PROVIDER
        value: auto          # use "hashing" on small instances to avoid loading PyTorch
      - key: ALLOW_PRIVATE_WEBHOOK_TARGETS
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: ai-business-db
    plan: basic-256mb
    databaseName: ai_business
